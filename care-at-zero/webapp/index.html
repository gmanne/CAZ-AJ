<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareAtZero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --blue-900: #16265C;
    --blue-700: #1E3A8A;
    --blue-600: #2952CC;
    --blue-500: #3B6BE0;
    --blue-100: #E6EDFB;
    --red-600: #D8362A;
    --red-50: #FDEDEB;
    --green-600: #1B8A4C;
    --green-50: #E9F7EF;
    --amber-500: #E0A106;
    --ink: #14213D;
    --ink-soft: #4B5670;
    --ink-faint: #7B84A0;
    --line: #E2E6F0;
    --page: #F6F7FB;
    --card: #FFFFFF;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(20,33,61,0.04), 0 8px 24px rgba(20,33,61,0.06);
  }
  [data-theme="dark"] {
    --ink: #EAEDF7; --ink-soft: #AEB6CC; --ink-faint: #838CA6; --line: #2B324A;
    --page: #0F1424; --card: #171D30; --blue-100: #1B2A4D; --green-50: #123424; --red-50: #3A1A17;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #EAEDF7; --ink-soft: #AEB6CC; --ink-faint: #838CA6; --line: #2B324A;
      --page: #0F1424; --card: #171D30; --blue-100: #1B2A4D; --green-50: #123424; --red-50: #3A1A17;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page); color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .brand, .stat-num, .btn { font-family: 'Manrope', 'Inter', sans-serif; }
  a { color: var(--blue-600); }
  button { font-family: inherit; cursor: pointer; }
  :focus-visible { outline: 2.5px solid var(--blue-500); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }

  .wrap { max-width: 920px; margin: 0 auto; padding: 0 20px; }

  .hero { background: linear-gradient(135deg, var(--blue-900), var(--blue-600)); color: white; padding: 34px 0 26px; }
  .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
  .badge { font-size: 12.5px; font-weight: 600; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.3); padding: 5px 12px; border-radius: 999px; white-space: nowrap; }
  .tagline { margin: 10px 0 0; font-size: 15.5px; color: rgba(255,255,255,0.88); max-width: 46ch; }
  .nav { display: flex; gap: 6px; margin-top: 22px; flex-wrap: wrap; }
  .nav button { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); color: rgba(255,255,255,0.85); padding: 9px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 7px; transition: background 120ms ease; }
  .nav button:hover { background: rgba(255,255,255,0.16); }
  .nav button[aria-current="page"] { background: white; color: var(--blue-700); }

  main { padding: 26px 0 70px; }

  .emergency { background: var(--red-50); border: 1px solid #F3C6C0; border-left: 4px solid var(--red-600); border-radius: 10px; padding: 13px 16px; font-size: 14px; color: var(--ink); margin-bottom: 26px; display: flex; gap: 10px; align-items: flex-start; }
  .emergency b { color: var(--red-600); }
  .info-banner { background: var(--blue-100); border: 1px solid #C7D6F5; border-radius: 10px; padding: 12px 16px; font-size: 13.5px; color: var(--ink-soft); margin-bottom: 20px; }

  section.block { margin-bottom: 40px; }
  .block-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  .block-icon { font-size: 19px; }
  .block-title { font-size: 19px; font-weight: 800; margin: 0; }
  .block-sub { font-size: 13.5px; color: var(--ink-soft); margin: -8px 0 16px; }

  .service-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .service-grid { grid-template-columns: 1fr; } }
  .service-card { background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; text-align: left; display: flex; gap: 12px; align-items: center; transition: border-color 120ms ease, background 120ms ease; }
  .service-card:hover { border-color: var(--blue-500); }
  .service-card[aria-pressed="true"] { border-color: var(--blue-600); background: var(--blue-100); }
  .service-icon { font-size: 21px; }
  .service-name { font-weight: 700; font-size: 14.5px; }
  .service-desc { font-size: 12.5px; color: var(--ink-soft); margin-top: 1px; }

  .search-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
  .search-step { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin: 0 0 12px; }
  .search-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  @media (max-width: 640px) { .search-row { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
  .field input, .field select { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14.5px; background: var(--card); color: var(--ink); font-family: inherit; }
  .field input:focus, .field select:focus { border-color: var(--blue-500); }
  .btn-primary { background: var(--red-600); color: white; border: none; border-radius: 10px; padding: 0 20px; font-size: 14.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; white-space: nowrap; }
  .btn-primary:hover { background: #C22D22; }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
  .find-cta-row { margin-top: 12px; }

  .filters-toggle { margin-top: 14px; }
  .filters-toggle summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--blue-600); list-style: none; }
  .filters-toggle summary::-webkit-details-marker { display: none; }
  .filters-toggle summary::before { content: '▸ '; }
  .filters-toggle[open] summary::before { content: '▾ '; }
  .filters-body { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  @media (max-width: 560px) { .filters-body { grid-template-columns: 1fr; } }
  .checkbox-field { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink); }

  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 640px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
  .stat-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 14px; text-align: center; }
  .stat-num { font-size: 25px; font-weight: 800; color: var(--blue-600); }
  .stat-label { font-size: 12px; color: var(--ink-soft); margin-top: 3px; }

  .card-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  @media (max-width: 760px) { .card-grid { grid-template-columns: 1fr; } }
  .ev-card, .result-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
  .ev-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pill-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .pill-date { background: var(--blue-100); color: var(--blue-700); }
  .pill-free { background: var(--green-50); color: var(--green-600); }
  .pill-vlow { background: #FFF6E5; color: var(--amber-500); }
  .pill-sliding { background: #FCEAE0; color: #B85A17; }
  .pill-outline { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  .pill-score { background: var(--green-50); color: var(--green-600); font-weight: 800; }
  .ev-name { font-weight: 700; font-size: 15px; margin: 2px 0 0; }
  .ev-meta { font-size: 12.5px; color: var(--ink-soft); display: flex; gap: 6px; align-items: flex-start; }
  .btn-outline { border: 1.5px solid var(--line); background: transparent; color: var(--ink); padding: 8px 14px; border-radius: 9px; font-size: 13px; font-weight: 600; }

  .action-row { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .action-row .btn-primary { padding: 0 16px; height: 38px; font-size: 13px; }
  .action-row .btn-outline { display: flex; align-items: center; gap: 6px; }

  .why-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

  .why-col ul { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-soft); }
  .why-col li { margin-bottom: 5px; }
  .why-icon { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex: none; }

  .why-toggle { background: none; border: none; color: var(--blue-600); font-size: 12.5px; font-weight: 600; padding: 0; text-align: left; }
  .reasons { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12.5px; color: var(--ink-soft); }
  .reasons li { padding: 3px 0; border-top: 1px dashed var(--line); }
  .reasons li:first-child { border-top: none; }

  .results-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .results-summary { font-size: 14.5px; font-weight: 700; }
  .view-toggle { display: flex; gap: 4px; background: var(--page); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
  .view-toggle button { background: none; border: none; padding: 6px 12px; font-size: 12.5px; font-weight: 600; border-radius: 7px; color: var(--ink-soft); }
  .view-toggle button[aria-pressed="true"] { background: var(--card); color: var(--blue-600); box-shadow: var(--shadow); }
  .map-placeholder { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 50px 20px; text-align: center; color: var(--ink-faint); font-size: 13.5px; }

  .empty { text-align: center; padding: 40px 20px; color: var(--ink-soft); font-size: 14px; }

  .detail-back { background: none; border: none; color: var(--blue-600); font-weight: 600; font-size: 13.5px; padding: 0; margin-bottom: 14px; }
  .detail-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); margin-bottom: 20px; }

  @media (max-width: 720px) { .detail-two-col { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px; }

  .checklist-ok { background: var(--green-50); border: 1px solid #BFE7CE; color: var(--green-600); border-radius: 9px; padding: 10px 12px; font-size: 13px; margin-bottom: 8px; }

  .kv-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 6px 0; border-top: 1px solid var(--line); }

  .kv-row label { color: var(--ink-soft); font-weight: 600; }
  .pill-svc { background: var(--blue-100); color: var(--blue-700); font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .svc-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .notes-box { font-size: 13px; color: var(--ink-soft); background: var(--page); border-radius: 8px; padding: 10px 12px; margin-top: 6px; }

  .score-total { font-size: 26px; font-weight: 800; color: var(--blue-600); }
  .score-total-label { font-size: 12px; color: var(--ink-soft); }
  .score-bar-row { margin: 10px 0; }
  .score-bar-top { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 4px; }
  .score-bar-track { height: 7px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .score-bar-fill { height: 100%; background: var(--blue-600); border-radius: 999px; }
  .source-link { font-size: 13px; word-break: break-all; }
  .feed-active { color: var(--green-600); font-weight: 700; }

  .referral-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .referral-preview { background: var(--page); border: 1px solid var(--line); border-radius: 9px; padding: 12px; font-size: 12.5px; white-space: pre-wrap; margin-top: 10px; font-family: 'SF Mono', Consolas, monospace; color: var(--ink-soft); }

  .save-btn { border: 1.5px solid var(--line); background: transparent; color: var(--ink); border-radius: 9px; padding: 8px 14px; font-size: 13px; font-weight: 700; display: flex; gap: 6px; align-items: center; }
  .save-btn[aria-pressed="true"] { background: #FFF6E5; border-color: var(--amber-500); color: #92670A; }

  .saved-item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
  .saved-name { font-weight: 700; font-size: 14.5px; }
  .saved-sub { font-size: 12.5px; color: var(--ink-soft); }
  .remove-btn { background: none; border: none; color: var(--red-600); font-size: 13px; font-weight: 600; }

  .about-tabs { display: flex; gap: 16px; border-bottom: 1px solid var(--line); margin-bottom: 20px; flex-wrap: wrap; }
  .about-tabs button { background: none; border: none; padding: 0 0 10px; font-size: 13.5px; font-weight: 600; color: var(--ink-faint); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .about-tabs button[aria-current="true"] { color: var(--blue-600); border-bottom-color: var(--blue-600); }
  .about-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
  .about-card p { font-size: 14.5px; color: var(--ink-soft); }
  .about-card ul { font-size: 14px; color: var(--ink-soft); }
  .about-card h2 { margin-top: 0; }
  .about-card h3 { font-size: 15.5px; margin: 20px 0 6px; }

  footer { text-align: center; font-size: 12px; color: var(--ink-soft); padding: 20px 0 40px; }
</style>
</head>

/* ================= Care Access scoring engine ================= */
const WEIGHTS = { cost:0.35, time:0.25, service:0.15, eligibility:0.10, distance:0.10, freshness:0.05 };
const WEIGHT_LABELS = {
  cost: 'Cost Fit', time: 'Density & Availability', service: 'Service Match',
  eligibility: 'Eligibility Confidence', distance: 'Distance Fit', freshness: 'Data Freshness',
};
const COST_RANK = { 'Free':100, 'Very Low Cost':75, 'Sliding Scale':55, 'Unknown':20 };

function haversineMiles(lat1,lon1,lat2,lon2){
  const R=3958.8, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function scoreRecord(r, service, timing, userLat, userLon, filters){
  filters = filters || {};
  const cost = COST_RANK[r.costClass] ?? 20;
  const costReason = `Cost category: ${r.costClass}`;

  let time, timeReason;
  if (r.nextDate){
    const daysOut = Math.round((new Date(r.nextDate) - new Date(new Date().toDateString())) / 86400000);
    if (daysOut < 0){ time=0; timeReason='Event has already passed'; }
    else if (daysOut === 0){ time=100; timeReason='Available today'; }
    else if (daysOut <= 7){ time=85; timeReason=`Upcoming in ${daysOut} day(s)`; }
    else { time=Math.max(30,70-daysOut); timeReason=`Upcoming in ${daysOut} day(s)`; }
  } else {
    if (timing==='today' && r.appointmentRule==='walk_in'){ time=90; timeReason='Walk-in available during regular clinic hours'; }
    else if (timing==='today'){ time=55; timeReason='Appointment required — may not be same-day'; }
    else { time=75; timeReason='Ongoing permanent availability'; }
  }

  const hasService = r.services.includes(service);
  const serviceScore = hasService ? 100 : 0;
  const serviceReason = hasService ? `Direct match for requested ${service} services` : `Does not list ${service}`;

  let elig, eligReason;
  if (!r.uninsuredAccepted && filters.insuranceStatus==='uninsured'){ elig=10; eligReason='May not accept uninsured patients'; }
  else if (r.eligibility && r.eligibility.length>10){ elig=85; eligReason='Open to all uninsured individuals residing in service coverage area'; }
  else { elig=50; eligReason='Eligibility details limited'; }

  const miles = haversineMiles(userLat,userLon,r.lat,r.lon);
  let dist;
  if (miles<=5){ dist=100; } else if (miles<=15){ dist=75; } else if (miles<=30){ dist=50; } else { dist=25; }
  const distReason = `Very close proximity (${miles.toFixed(1)} mi) minimizing transit burden`;

  const ageDays = Math.round((Date.now()-new Date(r.lastChecked))/86400000);
  let fresh, freshReason;
  if (ageDays<=7){ fresh=100; freshReason=`Source verified recently (${new Date(r.lastChecked).toISOString().slice(0,10)}) from official provider directory`; }
  else if (ageDays<=30){ fresh=70; freshReason='Source checked within the last month'; }
  else { fresh=30; freshReason='Source data may be outdated'; }

  const sub = {
    cost:       { score:cost,         reason: r.costClass==='Free' ? '100% Free care - $0 out-of-pocket cost for uninsured patients' : costReason },
    time:       { score:time,         reason: timeReason },
    service:    { score:serviceScore, reason: serviceReason },
    eligibility:{ score:elig,         reason: eligReason },
    distance:   { score:dist,         reason: distReason },
    freshness:  { score:fresh,        reason: freshReason },
  };
  let total = 0;
  Object.keys(sub).forEach(k=>{
    sub[k].max = Math.round(WEIGHTS[k]*100);
    sub[k].points = Math.round(sub[k].score*WEIGHTS[k]);
    total += sub[k].score*WEIGHTS[k];
  });

  return { total: Math.round(total), sub, miles, reasons: Object.keys(sub).map(k=>sub[k].reason) };
}

function insuranceLabel(r){
  if (r.costClass==='Free' && r.uninsuredAccepted) return 'Uninsured-Only Free';
  if (r.uninsuredAccepted) return `${r.costClass} — accepts uninsured`;
  return 'May not accept uninsured';
}
function facilityLabel(r){ return FACILITY_LABEL[r.siteType] || r.siteType.toUpperCase(); }
function availabilityText(r){ return r.nextDate ? `${r.nextDate} — ${r.nextHours}` : r.operatingHours; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function referralText(r, score){
  const lines = [
    `CareAtZero Referral Summary`,
    `============================`,
    `${r.name}`,
    `${facilityLabel(r)} · ${r.costClass}`,
    ``,
    `Address: ${r.address}`,

    `Website: ${r.website}`,
    ``,

    `Appointment policy: ${r.appointmentPolicyText}`,
    `Documents to bring: ${r.documents}`,
    `Eligibility: ${r.eligibility}`,
    ``,
    `Care Access Score: ${score ? score.total : '—'}/100`,
    `Source: ${r.sourceName} (last verified ${new Date(r.lastChecked).toISOString().slice(0,10)})`,
    ``,
    `Generated by CareAtZero — not medical advice.`,
  ];
  return lines.join('\n');
}
function downloadText(filename, text){
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function downloadICS(r){
  const dateStr = (r.nextDate || new Date().toISOString().slice(0,10)).replace(/-/g,'');
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CareAtZero//EN','BEGIN:VEVENT',
    `UID:${r.id}@careatzero`, `DTSTAMP:${dateStr}T000000Z`, `DTSTART;VALUE=DATE:${dateStr}`,
    `SUMMARY:${r.name}`, `LOCATION:${r.address}`,
    `DESCRIPTION:${(r.nextDate ? r.nextHours : r.operatingHours || '').replace(/,/g,'\\,')} — bring: ${(r.documents||'').replace(/,/g,'\\,')}`,
    'END:VEVENT','END:VCALENDAR',
  ].join('\r\n');
  downloadText(`${r.id}-careatzero.ics`, ics);
}

function loadSaved(){
  try { return JSON.parse(localStorage.getItem('careatzero_saved') || '[]'); }
  catch(e){ return []; }
}
function persistSaved(){
  try { localStorage.setItem('careatzero_saved', JSON.stringify(state.saved)); }
  catch(e){ /* storage unavailable this session */ }
}
function toggleSave(id){
  const i = state.saved.indexOf(id);
  if (i>=0) state.saved.splice(i,1); else state.saved.push(id);
  persistSaved(); render();
}

function currentCoords(){ return coordsForLocation(state.location); }

function computeResults(){
  const [lat,lon] = currentCoords();
  let matches = RECORDS.filter(r => r.services.includes(state.service));
  if (state.walkInOnly) matches = matches.filter(r => r.appointmentRule==='walk_in');
  return matches
    .map(r => ({ record:r, score: scoreRecord(r, state.service, state.timing, lat, lon, {insuranceStatus:state.insuranceStatus}) }))
    .sort((a,b) => b.score.total - a.score.total);
}
function runSearch(){ state.results = computeResults(); state.tab = 'find'; render(); }

  state.detailId = id; state.detailFrom = from || state.tab; state.detailFallback = false;
  state.tab = 'detail'; render();

        <h3>🕐 Schedule &amp; Admission Policy</h3>
        <div class="kv-row"><label>${r.nextDate ? 'Event Date' : 'Operating Hours'}</label><span>${availabilityText(r)}</span></div>
        <div class="kv-row"><label>Appointment Rule</label><span>${r.appointmentPolicyText}</span></div>
        <div class="kv-row"><label>Facility Type</label><span>${facilityLabel(r)}</span></div>
      </div>

      <div class="panel">
        <h3>🩺 Services Offered</h3>
        <div class="svc-row">${r.services.map(s=>`<span class="pill-svc">${SERVICE_META[s].label}</span>`).join('')}</div>
        ${r.notes ? `<div class="notes-box"><b>Special Notes:</b> ${r.notes}</div>` : ''}
      </div>
    </div>

    <div>
      <div class="panel">
        <h3>🎯 Care Access Score Breakdown</h3>
        <div><span class="score-total">${score.total}</span><span class="score-total-label"> /100 (Transparent 100-Point Model)</span></div>
        ${Object.entries(score.sub).map(([key,s])=>`
          <div class="score-bar-row">
            <div class="score-bar-top"><span>${WEIGHT_LABELS[key]} (${Math.round(WEIGHTS[key]*100)}%)</span><span>${s.points} pts</span></div>
            <div class="score-bar-track"><div class="score-bar-fill" style="width:${(s.points/s.max*100)}%;"></div></div>
          </div>`).join('')}
        <p style="font-size:12.5px;font-weight:700;margin:14px 0 6px;">Why this matches:</p>
        <ul class="reasons">${score.reasons.map(x=>`<li>${x}</li>`).join('')}</ul>
      </div>

      <div class="panel">
        <h3>🌐 Source Provenance &amp; Freshness</h3>
        <div class="kv-row"><label>Primary Source</label><span class="source-link"><a href="${r.sourceUrl}" target="_blank" rel="noopener">${r.sourceName}</a></span></div>
        <div class="kv-row"><label>Last Verified</label><span>${new Date(r.lastChecked).toISOString().slice(0,10)}</span></div>
        <div class="kv-row"><label>Feed Status</label><span class="feed-active">${r.feedStatus}</span></div>
        <div class="kv-row"><label>Official Website</label><span class="source-link"><a href="${r.website}" target="_blank" rel="noopener">${r.website}</a></span></div>
      </div>

      <div class="panel">
        <h3>🖨️ Share / Print Referral Summary</h3>
        <div class="referral-actions">
          <button class="btn-outline" data-ref-download="${r.id}">⬇️ Download Referral Summary (.txt)</button>
          <button class="btn-outline" data-ref-preview="${r.id}">${referralOpen?'Hide':'Preview'} Shareable Text</button>
        </div>
        ${referralOpen ? `<div class="referral-preview">${esc(referralText(r, score))}</div>` : ''}
      </div>
    </div>
  </div>`;
}

function renderSaved(){
  if (state.saved.length===0) return `
    <section class="block">
      <div class="block-head"><span class="block-icon">⭐</span><h2 class="block-title">My Saved Care Options</h2></div>
      <p class="block-sub">Keep track of clinics and pop-up events you want to visit. Saved locally on your device.</p>
      <div class="info-banner">You haven't saved any care options yet. When you search for free clinics or mobile events, click “Save Option” to bookmark them here for quick access.</div>
      <button class="btn-primary" data-goto-find="1">🔎 Find New Care Now</button>
    </section>`;
  return `
  <section class="block">
    <div class="block-head"><span class="block-icon">⭐</span><h2 class="block-title">My Saved Care Options</h2></div>
    <p class="block-sub">Keep track of clinics and pop-up events you want to visit. Saved locally on your device.</p>
    ${state.saved.map(id=>{
      const r = RECORDS.find(x=>x.id===id);
      if (!r) return '';
      return `
      <div class="saved-item">
        <div><div class="saved-name">${r.name}</div><div class="saved-sub">${r.address}</div></div>
        <div style="display:flex; gap:14px; align-items:center;">
          <button class="btn-outline" data-view="${r.id}" data-from="saved">View</button>
          <button class="remove-btn" data-save="${r.id}">Remove</button>
        </div>
      </div>`;
    }).join('')}
  </section>`;
}

const ABOUT_TABS = [
  ['mission','Mission & Overview'], ['scoring','Transparent Scoring'],
  ['sources','Sources & Methods'], ['privacy','Privacy & Emergency Safety'],
];
function renderAbout(){
  const tabBar = `<div class="about-tabs">${ABOUT_TABS.map(([k,label])=>
    `<button data-about-tab="${k}" aria-current="${state.aboutTab===k}">${label}</button>`).join('')}</div>`;

  let body = '';
  if (state.aboutTab==='mission'){
    body = `
    <h2>Our Mission</h2>
    <p>CareAtZero is a free, mobile-first web application designed to help uninsured and low-income individuals and families find genuinely free or very-low-cost medical, dental, vision, and behavioral healthcare they can realistically access soon.</p>
    <h3>The Problem We Solve</h3>
    <p>Free and safety-net healthcare exists, but the information is fragmented across federal directories, charitable clinic networks, mobile clinic calendars, and local public health feeds. An uninsured person often faces:</p>
    <ul>
      <li>Calling clinics only to find out they are not free or require insurance</li>
      <li>Missing time-sensitive pop-up events (like RAM or mobile dental buses)</li>
      <li>Arriving without required income or residency documents</li>
      <li>Searching directories that rank by distance rather than the realistic time to care</li>
    </ul>
    <p>CareAtZero bridges this gap by normalizing safety-net data, verifying cost tiers, scoring realistic accessibility, and giving patients a clear document checklist before they travel.</p>`;
  } else if (state.aboutTab==='scoring'){
    body = `
    <h2>Transparent Scoring</h2>
    <p>Every result gets a Care Access Score out of 100 — a plain weighted formula, never a black-box model. Judges, navigators, and patients can see exactly why an option ranked where it did.</p>
    <ul>
      <li><b>Cost Fit — 35%:</b> Free scores highest, then Very Low Cost, then Sliding Scale.</li>
      <li><b>Density &amp; Availability — 25%:</b> rewards options open or walk-in-able soon.</li>
      <li><b>Service Match — 15%:</b> only options offering the exact service searched are shown.</li>
      <li><b>Eligibility Confidence — 10%:</b> how clearly documented the eligibility rules are.</li>
      <li><b>Distance Fit — 10%:</b> closer options score higher, capped so cost still leads.</li>
      <li><b>Data Freshness — 5%:</b> recently verified sources score higher than stale ones.</li>
    </ul>`;
  } else if (state.aboutTab==='sources'){
    body = `
    <h2>Sources &amp; Methods</h2>
    <p>This preview runs on placeholder demo records so the search, scoring, and detail views can be tested end-to-end. Provider names shown here are illustrative — before any public demo or real use, each connector should pull from a real, citable source (state free-clinic associations, county health department calendars, RAM's public event schedule, etc.) and stamp every record with when it was last verified.</p>
    <p>CareAtZero never marks an option "Free" unless the source explicitly says so, and never fabricates availability when a source can't be reached.</p>`;
  } else {
    body = `
    <h2>Privacy &amp; Emergency Safety</h2>
    <p>No login or account is required to use CareAtZero. Nothing you search is sent to or stored on a server — “Saved” options live only in your own browser's local storage.</p>
    <p>CareAtZero does not diagnose symptoms, give medical advice, or store medical records. If you are experiencing a life-threatening emergency, call 911. For free 24/7 mental health and suicide crisis support, dial 988.</p>`;
  }
  return `<section class="block">
    <div class="block-head"><span class="block-icon">ℹ️</span><h2 class="block-title">About CareAtZero &amp; Trust Standards</h2></div>
    ${tabBar}
    <div class="about-card">${body}</div>
  </section>`;
}

/* ================= Wire up interactive elements ================= */
function wireInteractive(){
  document.querySelectorAll('[data-service]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.service=b.dataset.service; render(); });
  });
  const svcSelect = document.getElementById('service-select');
  if (svcSelect) svcSelect.addEventListener('change', ()=>{ state.service = svcSelect.value; render(); });

  const findBtn = document.getElementById('find-btn');
  if (findBtn) findBtn.addEventListener('click', ()=>{
    const loc = document.getElementById('loc-input');
    const tim = document.getElementById('timing-select');
    const ins = document.getElementById('insurance-select');
    const walk = document.getElementById('walkin-check');
    if (loc) state.location = loc.value || state.location;
    if (tim) state.timing = tim.value;
    if (ins) state.insuranceStatus = ins.value;
    if (walk) state.walkInOnly = walk.checked;
    runSearch();
  });

  document.querySelectorAll('[data-view-mode]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.resultsView = b.dataset.viewMode; render(); });
  });
  document.querySelectorAll('[data-view]').forEach(b=>{
    b.addEventListener('click', ()=> goDetail(b.dataset.view, b.dataset.from));
  });
  document.querySelectorAll('[data-save]').forEach(b=>{
    b.addEventListener('click', ()=> toggleSave(b.dataset.save));
  });
  document.querySelectorAll('[data-call]').forEach(b=>{
    b.addEventListener('click', ()=>{ window.location.href = `tel:${b.dataset.call.replace(/[^0-9+]/g,'')}`; });
  });
  document.querySelectorAll('[data-directions]').forEach(b=>{
    b.addEventListener('click', ()=>{ window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.dataset.directions)}`, '_blank', 'noopener'); });
  });
  document.querySelectorAll('[data-ics]').forEach(b=>{
    b.addEventListener('click', ()=>{ const r = RECORDS.find(x=>x.id===b.dataset.ics); if (r) downloadICS(r); });
  });
  document.querySelectorAll('[data-ref-download]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const r = RECORDS.find(x=>x.id===b.dataset.refDownload);
      const [lat,lon] = currentCoords();
      const score = scoreRecord(r, state.service, state.timing, lat, lon, {insuranceStatus:state.insuranceStatus});
      downloadText(`${r.id}-referral.txt`, referralText(r, score));
    });
  });
  document.querySelectorAll('[data-ref-preview]').forEach(b=>{
    b.addEventListener('click', ()=>{
      state.referralOpenId = state.referralOpenId===b.dataset.refPreview ? null : b.dataset.refPreview;
      render();
    });
  });
  document.querySelectorAll('[data-about-tab]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.aboutTab = b.dataset.aboutTab; render(); });
  });
  const gotoFind = document.querySelector('[data-goto-find]');
  if (gotoFind) gotoFind.addEventListener('click', ()=>{ state.tab='find'; render(); });
  const back = document.querySelector('[data-back]');
  if (back) back.addEventListener('click', ()=>{ state.tab = state.detailFrom || 'home'; render(); });
}

render();
</script>
</body>
</html>
