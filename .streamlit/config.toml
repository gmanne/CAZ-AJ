[server]
# Serves files in ./static at app/static/... (used for the logo in the header)
enableStaticServing = true

[client]
# Hides Streamlit's developer menu so the app looks like a normal phone app
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#0A7C74"
backgroundColor = "#F4F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0E2A5C"
